[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicing-agent"
version = "0.1.0"
description = "Inbound WhatsApp servicing agent for loan collections (Agentathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8.0"]

[project.scripts]
sa-generate-data = "servicing_agent.data.generators.cli:main"
sa-eval = "evals.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servicing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Naive UTC timestamps are deliberate (SQLite DateTime); move to aware datetimes with Postgres.
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning"]
