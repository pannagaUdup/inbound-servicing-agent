<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #ffffff; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #1f1f1f; }
  .page { width: 720px; padding: 48px 56px; box-sizing: border-box; }
  .tick { width: 84px; height: 84px; border-radius: 50%; background: #1e8e3e; color: #fff; font-size: 52px;

  .date { text-align: center; color: #555; font-size: 24px; margin: 0 0 36px; }
  .card { border: 2px solid #d7d7d7; border-radius: 22px; padding: 26px 32px; }
  .row { margin: 0 0 24px; } .row:last-child { margin: 0; }
  .label { color: #555; font-size: 22px; margin-bottom: 6px; }
  .value { font-size: 27px; }
</style></head><body><div class="page">

  <div class="card">
    <div class="row"><div class="label">Paid to</div><div class="value">Credit Nirvana Collections</div></div>
    <div class="row"><div class="label">UPI ID</div><div class="value">collect@cnbank</div></div>
    <div class="row"><div class="label">UPI transaction ID (UTR)</div><div class="value">512398765519</div></div>
    <div class="row"><div class="label">From</div><div class="value">Savings account ••6612</div></div>
  </div>
</div></body></html>
