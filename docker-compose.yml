services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    # Host 5433 to avoid clashing with the existing postgres_db on 5432.
    ports: ["5433:5432"]
  redis:
    image: redis:7
    # Host 6382 to avoid clashing with the existing redis on 6381.
    ports: ["6382:6379"]
